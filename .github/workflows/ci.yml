name: Vega ROCm image

on:
  workflow_dispatch:
  push:
    branches:
      - rocm-7.2.4
      - rocm-10.1-gfx90c
    paths-ignore:
      - "docs/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: vega-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          variant="${GITHUB_REF_NAME}"
          case "$variant" in
            rocm-7.2.4|rocm-10.1-gfx90c) ;;
            *) echo "Unsupported image branch: $variant" >&2; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          make version

      - name: Stop Docker before preparing build storage
        run: sudo systemctl stop docker

      - name: Make room for the image build
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: /var/lib/docker

      - name: Start Docker
        run: sudo systemctl start docker

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate
        id: build
        uses: docker/bake-action@v7
        env:
          HSA_OVERRIDE: "0"
          DOCKER_BUILD_SUMMARY: "true"
        with:
          source: .
          files: docker/rocm/rocm.hcl
          targets: default
          push: true
          set: |
            rocm.tags=${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.short_sha }}-${{ steps.metadata.outputs.variant }}
            rocm.tags=${{ steps.metadata.outputs.image }}:candidate-${{ steps.metadata.outputs.variant }}
            rocm.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            rocm.labels.org.opencontainers.image.revision=${{ github.sha }}
            rocm.labels.video.frigate.reproduction-source=fdeafe9f4c401644f6acc7389e8f406dd241d068
            deps.cache-from=type=gha,scope=${{ steps.metadata.outputs.variant }}
            deps.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-deps
            deps.cache-to=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-deps,mode=max,ignore-error=true
            rootfs.cache-from=type=gha,scope=${{ steps.metadata.outputs.variant }}
            rootfs.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-rootfs
            rootfs.cache-to=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-rootfs,mode=max,ignore-error=true
            native-sdk.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-native-sdk
            native-sdk.cache-to=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-native-sdk,mode=max,ignore-error=true
            migraphx.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-native-sdk
            migraphx.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-migraphx-gfx90c
            migraphx.cache-to=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-migraphx-gfx90c,mode=max,ignore-error=true
            rocm.cache-from=type=gha,scope=${{ steps.metadata.outputs.variant }}
            rocm.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-${{ steps.metadata.outputs.variant }}
            rocm.cache-from=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-migraphx-gfx90c
            rocm.cache-to=type=registry,ref=${{ steps.metadata.outputs.image }}:cache-${{ steps.metadata.outputs.variant }},mode=max,ignore-error=true

      - name: Save build receipt
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          VARIANT: ${{ steps.metadata.outputs.variant }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > build-metadata.json
          {
            echo "Candidate: $IMAGE:$SHORT_SHA-$VARIANT"
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "GPU qualification is separate from this image build."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ steps.metadata.outputs.variant }}
          path: build-metadata.json
